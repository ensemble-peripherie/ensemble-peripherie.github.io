<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listen — ensemble: périphérie</title>
<meta name="description" content="Recordings from ensemble: périphérie — a contemporary chamber music ensemble.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:oklch(0.14 0.008 40);
    --ink:oklch(0.95 0.01 60);
    --ink-dim:oklch(0.8 0.02 60);
    --ink-mute:oklch(0.55 0.02 60);
    --line:oklch(0.4 0.02 60);
    --accent:oklch(0.6 0.19 40);
    --max:1120px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'IBM Plex Sans',sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,.serif{font-family:'Newsreader',serif;font-style:italic;font-weight:400;}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:var(--max);margin:0 auto;padding:0 40px;}

  .field-wrap{position:relative;overflow:hidden;}
  .field-wrap > svg{position:absolute;top:0;left:0;width:100%;height:100%;}

  header{position:relative;z-index:3;padding:44px 0 0;}
  header .wrap{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:20px;}
  .brand{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.1em;}
  .brand b{font-weight:500;}
  nav ul{display:flex;gap:30px;list-style:none;flex-wrap:wrap;}
  nav a{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);padding-bottom:4px;border-bottom:1px solid transparent;}
  nav a:hover{color:var(--ink);}
  nav a.active{color:var(--ink);border-bottom-color:var(--accent);}

  .listen-hero{position:relative;z-index:3;padding:140px 0 0;max-width:640px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:26px;}
  .listen-hero h1{font-size:clamp(34px,5vw,52px);line-height:1.15;}

  .listen-list{position:relative;z-index:3;padding:76px 0 100px;display:flex;flex-direction:column;gap:18px;max-width:820px;}
  .track{display:flex;align-items:center;gap:24px;border:1px dashed var(--line);padding:22px 26px;}
  .track svg{flex-shrink:0;}
  .track .title{font-family:'Newsreader',serif;font-style:italic;font-size:19px;color:var(--ink-mute);margin-bottom:4px;}
  .track .meta{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-mute);}

  @media (max-width:760px){
    .wrap{padding:0 24px;}
    header{padding:32px 0 0;}
    nav ul{gap:18px;}
    .listen-hero{padding:90px 0 0;}
    .listen-list{padding:56px 0 70px;}
    .track{padding:18px 20px;gap:18px;}
    .field-wrap > svg{opacity:.3;}
  }
</style>
</head>
<body>

<div class="field-wrap">
  <svg viewBox="0 0 1440 1040" preserveAspectRatio="xMaxYMin slice">
    <defs>
      <filter id="soften" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="30" />
      </filter>
    </defs>
    <g filter="url(#soften)">
      <polygon points="1440,0 1440,1040 1089,1040 1012,975 1127,917 1005,828 1032,730 1018,658 1024,596 1003,507 1141,448 1120,352 967,291 1098,242 979,145 1114,75 1058,0"
        fill="oklch(0.4 0.1 300)" opacity="0.85" />
      <polygon points="1440,10 1440,1040 1291,1027 1172,964 1128,906 1202,847 1257,754 1256,671 1108,628 1155,538 1156,508 1204,415 1290,361 1160,278 1110,203 1298,121 1291,68 1270,0"
        fill="oklch(0.6 0.19 40)" opacity="0.9" />
      <polygon points="1440,40 1440,1040 1213,1040 1301,941 1388,874 1260,816 1242,704 1266,635 1230,542 1340,474 1250,387 1205,305 1309,249 1242,183 1226,58 1193,0"
        fill="oklch(0.8 0.17 90)" opacity="0.55" />
    </g>
  </svg>

  <header>
    <div class="wrap">
      <a href="index.html" class="brand">ensemble: <b>périphérie</b></a>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="artists.html">Artists</a></li>
          <li><a href="listen.html" class="active">Listen</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <section class="listen-hero wrap">
    <div class="eyebrow">Listen</div>
    <h1 class="serif">Recordings from<br>the periphery.</h1>
  </section>

  <section class="listen-list wrap">
    <div class="track">
      <svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="16" fill="none" stroke="oklch(0.5 0.02 60)" stroke-width="1.2"/><polygon points="14,11 24,17 14,23" fill="oklch(0.5 0.02 60)"/></svg>
      <div>
        <div class="title">[Recording title]</div>
        <div class="meta">[Composer &middot; Year]</div>
      </div>
    </div>
    <div class="track">
      <svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="16" fill="none" stroke="oklch(0.5 0.02 60)" stroke-width="1.2"/><polygon points="14,11 24,17 14,23" fill="oklch(0.5 0.02 60)"/></svg>
      <div>
        <div class="title">[Recording title]</div>
        <div class="meta">[Composer &middot; Year]</div>
      </div>
    </div>
    <div class="track">
      <svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="16" fill="none" stroke="oklch(0.5 0.02 60)" stroke-width="1.2"/><polygon points="14,11 24,17 14,23" fill="oklch(0.5 0.02 60)"/></svg>
      <div>
        <div class="title">[Recording title]</div>
        <div class="meta">[Composer &middot; Year]</div>
      </div>
    </div>
  </section>
</div>

</body>
</html>
