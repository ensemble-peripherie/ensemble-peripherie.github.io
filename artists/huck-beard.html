<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Huck Beard — ensemble: périphérie</title>
<meta name="description" content="Huck Beard, Artistic Director of ensemble: périphérie.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:oklch(0.14 0.008 40);
    --ink:oklch(0.95 0.01 60);
    --ink-dim:oklch(0.8 0.02 60);
    --ink-mute:oklch(0.55 0.02 60);
    --line:oklch(0.4 0.02 60);
    --accent:oklch(0.6 0.19 40);
    --max:1120px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'IBM Plex Sans',sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,.serif{font-family:'Newsreader',serif;font-style:italic;font-weight:400;}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:var(--max);margin:0 auto;padding:0 40px;}

  .field-wrap{position:relative;overflow:hidden;}
  .field-wrap > svg{position:absolute;top:0;left:0;width:100%;height:100%;}

  header{position:relative;z-index:3;padding:44px 0 0;}
  header .wrap{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:20px;}
  .brand{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.1em;}
  .brand b{font-weight:500;}
  nav ul{display:flex;gap:30px;list-style:none;flex-wrap:wrap;}
  nav a{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);padding-bottom:4px;border-bottom:1px solid transparent;}
  nav a:hover{color:var(--ink);}
  nav a.active{color:var(--ink);border-bottom-color:var(--accent);}

  /* ---------- ARTIST HERO ---------- */
  .artist-hero{position:relative;z-index:3;padding:140px 0 0;}
  .breadcrumb{
    display:inline-block;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink-mute);
    margin-bottom:26px;
    transition:color .25s ease;
  }
  .breadcrumb:hover{color:var(--accent);}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:22px;}
  .hero-grid{display:grid;grid-template-columns:1fr auto;gap:56px;align-items:start;}
  .artist-hero h1{font-size:clamp(34px,5.4vw,54px);line-height:1.12;margin-bottom:16px;}
  .artist-hero .subtitle{font-size:16.5px;line-height:1.6;color:var(--ink-mute);max-width:52ch;}
  .artist-hero .subtitle.placeholder{font-style:italic;}
  .artist-photo{width:260px;flex-shrink:0;aspect-ratio:4/5;border:1px solid oklch(0.34 0.03 40);overflow:hidden;}
  .artist-photo img{width:100%;height:100%;object-fit:cover;display:block;}

  /* ---------- BIO ---------- */
  .bio{position:relative;z-index:3;padding:72px 0 100px;}
  .bio-body{max-width:68ch;}
  .bio-body p{font-size:16.5px;line-height:1.85;color:var(--ink-dim);margin-bottom:24px;}
  .bio-body p:last-child{margin-bottom:0;}
  .bio-body em{font-style:italic;}
  .bio-body a{color:var(--ink);border-bottom:1px solid var(--accent);transition:color .25s ease;}
  .bio-body a:hover{color:var(--accent);}
  .bio-placeholder{
    border:1px dashed var(--line);
    padding:32px;
    max-width:68ch;
  }
  .bio-placeholder span{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--ink-mute);
  }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width:760px){
    .wrap{padding:0 24px;}
    header{padding:32px 0 0;}
    nav ul{gap:18px;}
    .artist-hero{padding:90px 0 0;}
    .hero-grid{grid-template-columns:1fr;gap:28px;}
    .artist-photo{width:200px;}
    .bio{padding:52px 0 70px;}
    .field-wrap > svg{opacity:.3;}
  }
</style>
</head>
<body>

<div class="field-wrap">
  <svg viewBox="0 0 1440 900" preserveAspectRatio="xMaxYMin slice">
    <defs>
      <filter id="soften" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="30" />
      </filter>
    </defs>
    <g filter="url(#soften)">
      <polygon points="1440,0 1440,900 1018,900 1034,843 984,718 1161,633 1135,553 1110,488 1219,374 1066,301 1028,219 1007,138 1062,71 1181,-26 1126,-131 994,-209 1084,-273 992,-386 1130,0"
        fill="oklch(0.4 0.1 300)" opacity="0.85" />
      <polygon points="1440,20 1440,900 1138,900 1211,801 1219,756 1227,657 1226,583 1241,511 1147,441 1169,329 1243,265 1224,182 1158,94 1181,42 1335,-78 1296,-162 1280,-206 1198,-318 1212,-391 1275,0"
        fill="oklch(0.6 0.19 40)" opacity="0.9" />
      <polygon points="1440,60 1440,900 1285,900 1296,777 1274,679 1273,590 1384,500 1393,431 1237,343 1384,241 1362,172 1365,70 1257,-48 1380,-139 1316,-250 1292,-339 1207,0"
        fill="oklch(0.8 0.17 90)" opacity="0.55" />
    </g>
  </svg>

  <header>
    <div class="wrap">
      <a href="../index.html" class="brand">ensemble: <b>périphérie</b></a>
      <nav>
        <ul>
          <li><a href="../index.html">Home</a></li>
          <li><a href="../about.html">About</a></li>
          <li><a href="../artists.html" class="active">Artists</a></li>
          <li><a href="../listen.html">Listen</a></li>
          <li><a href="../contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <section class="artist-hero wrap">
    <a href="../artists.html" class="breadcrumb">← All Artists</a>
    <div class="hero-grid">
      <div>
        <div class="eyebrow">Artistic Director</div>
        <h1 class="serif">Huck Beard</h1>
        <div class="subtitle placeholder">[Title / affiliation]</div>
      </div>
      <figure class="artist-photo">
        <img src="../assets/huck-beard.jpg" alt="Portrait of Huck Beard">
      </figure>
    </div>
  </section>

  <section class="bio wrap">
    <div class="bio-placeholder">
      <span>[Bio coming soon]</span>
    </div>
  </section>
</div>

</body>
</html>
